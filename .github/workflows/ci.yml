name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Queue rather than cancel: every commit gets its own iOS screenshots.
  cancel-in-progress: false

permissions:
  contents: write # the iOS job commits screenshots back to claude/* branches

jobs:
  web:
    name: Web + API (lint, types, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - name: iOS safety rules match packages/safety
        run: npm run safety:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end + accessibility
        run: npm run test:e2e
        env:
          CI: "true"

  ios:
    name: iOS (core package + app build + unit tests)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to restore file timestamps below

      # Git checkouts stamp every file with "now", which makes Xcode treat a
      # restored DerivedData cache as stale and rebuild everything. Resetting
      # each file's mtime to its last commit keeps unchanged files cached.
      - name: Restore file timestamps
        working-directory: apps/ios
        run: |
          git ls-files | while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            touch -t "$(date -r "$t" +%Y%m%d%H%M.%S)" "$f"
          done

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick simulator
        id: sim
        run: |
          SDK_MAJOR=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          UDID=$(xcrun simctl list devices available -j | SDK_MAJOR="$SDK_MAJOR" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          wanted = "iOS-" + os.environ["SDK_MAJOR"] + "-"
          for runtime in sorted(devices, reverse=True):
              if wanted in runtime:
                  for d in devices[runtime]:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: HealthMateCore tests
        run: swift test
        working-directory: apps/ios/Packages/HealthMateCore

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: apps/ios

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/ios/DerivedData
          key: dd-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/project.yml', 'apps/ios/HealthMate/Resources/**') }}
          restore-keys: dd-${{ steps.xcode.outputs.version }}-

      - name: Build and test app
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project HealthMate.xcodeproj \
            -scheme HealthMate \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      # Signed-in screenshots use the real API in demo mode (scripted AI
      # answers, labelled as a demo in the app; non-medical demo account).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start demo API
        run: |
          npm ci --no-audit --no-fund
          npm run safety:build
          npm run build -w @healthmate/api
          nohup npm run demo -w @healthmate/api > "$RUNNER_TEMP/demo-api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/v1/meta && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/demo-api.log"; exit 1

      # Visual review: install the built app and capture key screens in light
      # and dark mode. Launch arguments override UserDefaults (NSArgumentDomain),
      # which is how each run picks a screen.
      - name: Capture screenshots
        working-directory: apps/ios
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find DerivedData/Build/Products -path "*iphonesimulator*" -name "HealthMate.app" -maxdepth 3 | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p screenshots
          shoot() { # name, onboarding-done, scroll-target, [extra launch args...]
            local name=$1 onboarded=$2 scroll=$3; shift 3
            xcrun simctl terminate "$UDID" com.healthmate.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.healthmate.app -hasCompletedOnboarding "$onboarded" -hmScrollTarget "$scroll" "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            shoot "onboarding-$appearance" NO ""
            shoot "home-$appearance" YES ""
            shoot "home-plan-$appearance" YES plan
            shoot "home-activity-$appearance" YES activity
            shoot "plan-$appearance" YES "" -hmInitialTab plans
            shoot "plan-add-$appearance" YES "" -hmInitialTab plans -hmShowAddPlan YES
            shoot "chat-$appearance" YES "" -hmInitialTab chat
            shoot "health-$appearance" YES "" -hmInitialTab health
            shoot "profile-$appearance" YES "" -hmInitialTab profile
            DEMO=(-hmDemoEmail demo@healthmate.example -hmDemoPassword demo-password-123)
            shoot "home-account-$appearance" YES "" "${DEMO[@]}"
            shoot "chat-conversation-$appearance" YES "" -hmInitialTab chat -hmOpenLatestConversation YES "${DEMO[@]}"
            shoot "profile-account-$appearance" YES "" -hmInitialTab profile "${DEMO[@]}"
          done

      # Artifact storage isn't reachable from every review environment, so the
      # screenshots are also committed to docs/design/ios-screenshots on the
      # same branch ([skip ci] prevents a loop).
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: apps/ios/screenshots
          retention-days: 14

      - name: Commit screenshots to branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          DEST=docs/design/ios-screenshots
          rm -rf "$DEST" && mkdir -p "$DEST"
          for f in apps/ios/screenshots/*.png; do
            # Half-resolution JPEGs keep the repository small.
            sips -Z 1300 -s format jpeg -s formatOptions 75 "$f" --out "$DEST/$(basename "${f%.png}").jpg" >/dev/null
          done
          echo "${{ github.sha }}" > "$DEST/SOURCE_COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "iOS screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
