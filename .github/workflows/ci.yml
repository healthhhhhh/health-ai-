name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Queue rather than cancel: every commit gets its own iOS screenshots.
  cancel-in-progress: false

permissions:
  contents: write # the iOS job commits screenshots back to claude/* branches

jobs:
  web:
    name: Web + API (lint, types, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - name: iOS safety rules match packages/safety
        run: npm run safety:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end + accessibility
        run: npm run test:e2e
        env:
          CI: "true"

  supabase:
    name: API on Supabase + Redis (migrations, RLS, Storage, Auth, jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pinned for reproducibility: resolving "latest" calls the GitHub API, which
      # rate-limits shared runners. The action is pinned to the commit of its v1 tag
      # that the green runs used, and the CLI to 2.119.0 (which also fixes the
      # Supabase container images `supabase start` pulls). Bump both deliberately.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0
      - run: supabase --version
      - name: Start local Supabase (applies supabase/migrations)
        # Its startup table prints the CLI's local default keys before they can be masked:
        # keep the output out of the log unless startup fails. Migration progress is still shown.
        run: |
          supabase start > /tmp/supabase-start.log 2>&1 || { cat /tmp/supabase-start.log; exit 1; }
          grep -E "Applying migration|Seeding|Started supabase" /tmp/supabase-start.log || true
      - name: Lint database functions
        run: supabase db lint --level error
      - name: Export local Supabase settings
        run: |
          supabase status -o json > /tmp/sb.json
          # Local, throwaway keys — masked anyway so no key ever appears in CI logs.
          for key in '.PUBLISHABLE_KEY // .ANON_KEY' '.SECRET_KEY // .SERVICE_ROLE_KEY' '.JWT_SECRET // empty' '.DB_URL'; do
            value=$(jq -r "$key" /tmp/sb.json)
            [ -n "$value" ] && [ "$value" != null ] && echo "::add-mask::$value"
          done
          {
            echo "SUPABASE_URL=$(jq -r .API_URL /tmp/sb.json)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' /tmp/sb.json)"
            echo "SUPABASE_SECRET_KEY=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' /tmp/sb.json)"
            echo "TEST_DATABASE_URL=$(jq -r .DB_URL /tmp/sb.json)"
            echo "SUPABASE_MAILPIT_URL=$(jq -r '.MAILPIT_URL // .INBUCKET_URL' /tmp/sb.json)"
          } >> "$GITHUB_ENV"
      - name: Embeddings Edge Function (gte-small)
        run: |
          echo "EMBED_FUNCTION_SECRET=ci-embed-secret-0123456789abcdef" > /tmp/functions.env
          supabase functions serve --env-file /tmp/functions.env > /tmp/functions.log 2>&1 &
          # Ready when the function answers with our shared secret: the runtime started by `supabase start`
          # answers 403 before `functions serve` has loaded the env file, and the gateway returns 5xx while booting.
          status=000
          for i in $(seq 1 60); do
            status=$(curl -s -m 180 -o /tmp/embed.json -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/embed" \
              -H "Content-Type: application/json" -H "x-healthmate-secret: ci-embed-secret-0123456789abcdef" \
              -d '{"input":["headache after screens","walks daily"]}' || true)
            [ "$status" = 200 ] && break
            sleep 3
          done
          [ "$status" = 200 ] || { echo "embed function not ready (last status $status)"; cat /tmp/functions.log; exit 1; }
          test "$(jq '.embeddings | length' /tmp/embed.json)" = 2
          test "$(jq '.embeddings[0] | length' /tmp/embed.json)" = 384
      - name: API tests on Supabase Postgres + Redis, and live Auth/Storage/Data API
        run: npm run safety:build && npm test -w @healthmate/api -- --no-file-parallelism
        env:
          REDIS_URL: redis://127.0.0.1:6379
          SUPABASE_LIVE_TEST: "1"
      - name: Migrations are idempotent
        run: npm run build -w @healthmate/api && DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate -w @healthmate/api | tee /tmp/migrate.log && grep -q "up to date" /tmp/migrate.log

  ios:
    name: iOS (core package + app build + unit tests)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to restore file timestamps below

      # Git checkouts stamp every file with "now", which makes Xcode treat a
      # restored DerivedData cache as stale and rebuild everything. Resetting
      # each file's mtime to its last commit keeps unchanged files cached.
      - name: Restore file timestamps
        working-directory: apps/ios
        run: |
          git ls-files | while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            touch -t "$(date -r "$t" +%Y%m%d%H%M.%S)" "$f"
          done

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick simulator
        id: sim
        run: |
          SDK_MAJOR=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          UDID=$(xcrun simctl list devices available -j | SDK_MAJOR="$SDK_MAJOR" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          wanted = "iOS-" + os.environ["SDK_MAJOR"] + "-"
          for runtime in sorted(devices, reverse=True):
              if wanted in runtime:
                  for d in devices[runtime]:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: HealthMateCore tests
        run: swift test
        working-directory: apps/ios/Packages/HealthMateCore

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: apps/ios

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/ios/DerivedData
          key: dd-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/project.yml', 'apps/ios/HealthMate/Resources/**') }}
          restore-keys: dd-${{ steps.xcode.outputs.version }}-

      # UI tests and signed-in screenshots use the real API in demo mode (scripted AI
      # answers, labelled as a demo in the app; non-medical demo account).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start demo API
        run: |
          npm ci --no-audit --no-fund
          npm run safety:build
          npm run build -w @healthmate/api
          nohup npm run demo -w @healthmate/api > "$RUNNER_TEMP/demo-api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/v1/meta && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/demo-api.log"; exit 1

      - name: Build and test app
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project HealthMate.xcodeproj \
            -scheme HealthMate \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)
      - name: Show test failure details
        if: failure()
        working-directory: apps/ios
        run: |
          result=$(ls -td DerivedData/Logs/Test/*.xcresult 2>/dev/null | head -1)
          [ -n "$result" ] || exit 0
          xcrun xcresulttool get test-results tests --path "$result" --format json \
            | jq -r '.. | objects | select(.nodeType? == "Failure Message") | .name' || true

      # Visual review: install the built app and capture key screens in light
      # and dark mode. Launch arguments override UserDefaults (NSArgumentDomain),
      # which is how each run picks a screen.
      - name: Capture screenshots
        working-directory: apps/ios
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find DerivedData/Build/Products -path "*iphonesimulator*" -name "HealthMate.app" -maxdepth 3 | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl uninstall "$UDID" com.healthmate.app 2>/dev/null || true # start clean after UI tests
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p screenshots
          shoot() { # name, onboarding-done, scroll-target, [extra launch args...]
            local name=$1 onboarded=$2 scroll=$3; shift 3
            xcrun simctl terminate "$UDID" com.healthmate.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.healthmate.app -hasCompletedOnboarding "$onboarded" -hmScrollTarget "$scroll" "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            shoot "onboarding-$appearance" NO ""
            shoot "home-$appearance" YES ""
            shoot "home-plan-$appearance" YES plan
            shoot "home-activity-$appearance" YES activity
            shoot "plan-$appearance" YES "" -hmInitialTab plans
            shoot "plan-add-$appearance" YES "" -hmInitialTab plans -hmShowAddPlan YES
            shoot "chat-$appearance" YES "" -hmInitialTab chat
            shoot "health-$appearance" YES "" -hmInitialTab health
            shoot "profile-$appearance" YES "" -hmInitialTab profile
            DEMO=(-hmDemoEmail demo@healthmate.example -hmDemoPassword demo-password-123)
            shoot "home-account-$appearance" YES "" "${DEMO[@]}"
            shoot "chat-conversation-$appearance" YES "" -hmInitialTab chat -hmOpenLatestConversation YES "${DEMO[@]}"
            shoot "profile-account-$appearance" YES "" -hmInitialTab profile "${DEMO[@]}"
          done

      # Artifact storage isn't reachable from every review environment, so the
      # screenshots are also committed to docs/design/ios-screenshots on the
      # same branch ([skip ci] prevents a loop).
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: apps/ios/screenshots
          retention-days: 14

      - name: Commit screenshots to branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          DEST=docs/design/ios-screenshots
          rm -rf "$DEST" && mkdir -p "$DEST"
          for f in apps/ios/screenshots/*.png; do
            # Half-resolution JPEGs keep the repository small.
            sips -Z 1300 -s format jpeg -s formatOptions 75 "$f" --out "$DEST/$(basename "${f%.png}").jpg" >/dev/null
          done
          echo "${{ github.sha }}" > "$DEST/SOURCE_COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "iOS screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
