name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end + accessibility
        run: npm run test:e2e
        env:
          CI: "true"

  ios:
    name: iOS (core package + app build + unit tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: HealthMateCore tests
        run: swift test
        working-directory: apps/ios/Packages/HealthMateCore
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: apps/ios
      - name: Build and test app
        working-directory: apps/ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' | head -1)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project HealthMate.xcodeproj \
            -scheme HealthMate \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit ${PIPESTATUS[0]}
