# XcodeGen spec — run `xcodegen generate` in apps/ios to create HealthMate.xcodeproj.
# The .xcodeproj is generated (and git-ignored) so the project file never conflicts.
name: HealthMate
options:
  bundleIdPrefix: com.healthmate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  HealthMateCore:
    path: Packages/HealthMateCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HealthMate:
    type: application
    platform: iOS
    sources:
      - path: HealthMate
    dependencies:
      - package: HealthMateCore
    info:
      path: HealthMate/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthMate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # Home data: "live" (Apple Health, account, timeline) or "sample" (labelled demo data).
        HMDataSource: $(HM_DATA_SOURCE)
        HMAPIBaseURL: $(HM_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: HealthMate uses the microphone only while you ask a question by voice. Audio isn't stored.
        NSSpeechRecognitionUsageDescription: HealthMate turns your spoken question into text so you can check it before sending.
        NSLocationWhenInUseUsageDescription: HealthMate uses your location to show emergency departments, clinics and pharmacies near you. It isn't sent to HealthMate.
        NSCameraUsageDescription: Take a photo of a report or of a skin concern for the AI Health Assistant to review.
        NSHealthShareUsageDescription: HealthMate reads the Apple Health data you choose (like steps, heart rate and sleep) to show your trends and personalise your plan.
    entitlements:
      path: HealthMate/Resources/HealthMate.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthmate.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        HM_DATA_SOURCE: live
        HM_API_BASE_URL: http:/$()/localhost:4000/v1

  HealthMateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthMateTests
    dependencies:
      - target: HealthMate
      - package: HealthMateCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HealthMateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthMateUITests
    dependencies:
      - target: HealthMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HealthMate

schemes:
  HealthMate:
    build:
      targets:
        HealthMate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthMateTests
        - HealthMateUITests
