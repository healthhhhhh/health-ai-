# XcodeGen spec — run `xcodegen generate` in apps/ios to create HealthMate.xcodeproj.
# The .xcodeproj is generated (and git-ignored) so the project file never conflicts.
name: HealthMate
options:
  bundleIdPrefix: com.healthmate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  HealthMateCore:
    path: Packages/HealthMateCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HealthMate:
    type: application
    platform: iOS
    sources:
      - path: HealthMate
    dependencies:
      - package: HealthMateCore
    info:
      path: HealthMate/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthMate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # Data source: "mock" (sample data) or "api" (shared backend).
        HMDataSource: $(HM_DATA_SOURCE)
        HMAPIBaseURL: $(HM_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthmate.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        HM_DATA_SOURCE: mock
        HM_API_BASE_URL: http:/$()/localhost:4000/v1

  HealthMateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthMateTests
    dependencies:
      - target: HealthMate
      - package: HealthMateCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthMate:
    build:
      targets:
        HealthMate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthMateTests
